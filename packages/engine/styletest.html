<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>threedog · style test</title>
<style>
  html,body{height:100%;margin:0;overflow:hidden;background:#16181a;color:#e6e8ea;font:13px system-ui,sans-serif}
  #view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}

  #panel-note{position:fixed;right:12px;top:12px;background:#5a2a2a;color:#fff;padding:8px 12px;border-radius:8px;max-width:340px}
  #panel-note[hidden]{display:none}
</style>
</head>

<canvas id="view" tabindex="0"></canvas>
<div id="help">Style test · <code>?time</code> <code>weather</code> <code>style</code> <code>env</code> <code>view</code> <code>panel=1</code> (values: examples/styletest/params.js)</div>
<div id="panel-note" hidden></div>
<script type="module" src="/examples/styletest/main.js"></script>
</body>
</html>
