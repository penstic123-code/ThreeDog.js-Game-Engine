# Basic CI: static checks, the core browser tests (fast group), and a production build of the engine and the games.
# The full browser suite (npm test) is long; run it locally before a release. Add groups to the smoke step below as they prove stable.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Static checks (rules, types, docs, content)
        run: npm run check
      - name: Install the browser the tests drive
        run: npx playwright install --with-deps chromium
      # Core hardening + save/session/threads guards: each builds fresh headless engines, no game content, a few seconds each
      - name: Core browser tests (smoke)
        run: npm test -- "Core modules" "Core review" "S1 module order" "Loading"
      # Fixed checks that fit a few minutes (about 90 s locally): asset lifetime and backend selection (WebGPURenderer on its WebGL2 fallback).
      # Real WebGPU is a separate run on a machine with a GPU, not here: the runner has no device.
      - name: Asset lifetime and backend selection
        run: npm test -- "Lifetime" "Backend"
      # The tools test builds a real glb in a temp folder; texture compression needs the ktx command, which the runner does not have,
      # so on the runner only the failed-model guard runs; the rest runs wherever ktx is installed (set THREEDOG_KTX_DIR)
      - name: Assets optimize (tools)
        run: npm test -- "assets optimize"
      - name: Build engine and games
        run: npm run build
